<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天道打工人</title>
<link rel="icon" type="image/jpeg" href="img/p_r0.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 书法字体非阻塞：不挡首屏，未到用楷体兜底 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ================= 启动加载屏：必修资源齐了才放行 ================= -->
<div id="bootLoader">
  <div class="bl-ink"></div>
  <div class="bl-seal">天曹<br>候补</div>
  <h1 class="bl-title">天 道 打 工 人</h1>
  <div class="bl-sub">阴阳两界劳务契 · 无编制</div>
  <div class="bl-bar"><i id="blBar"></i></div>
  <div class="bl-meta"><span id="blTip">判官笔已蘸墨，正在勾销两界往来文书…</span><b id="blPct">0%</b></div>
</div>
<!-- 进门后切换场景的小型点卯遮罩（JS 动态填充） -->
<div id="bootGate" class="hidden"><div class="bg-card"><div class="bg-seal">点卯</div><div id="bgTip">研墨铺纸…</div></div></div>

<!-- 画质渲染分层：氛围底图 → 情景图 → Pixi 墨雾 → 浮墨/雾气兜底 -->
<div id="ambientBg"></div>
<div id="sceneBg"></div>
<div id="fxCanvas"></div>
<div id="inkLayer"></div>
<div id="mistLayer"></div>
<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-seal"><img id="brandSealImg" src="img/p_r0.jpg" alt="玩家立绘"></span>
      <div>
        <h1>天道打工人</h1>
        <small>阴阳两界劳务契 · 无编制</small>
      </div>
    </div>
    <div class="top-stats" id="topStats"></div>
  </header>

  <!-- 主舞台：各分页与下凡/战斗流程都渲染到这里 -->
  <main id="pageStage" class="stage"></main>

  <!-- 底部标签导航 -->
  <nav id="tabbar">
    <button class="tab" data-tab="desk">
      <span class="tab-ico">牍</span><span class="tab-txt">案牍</span><i class="tab-dot" id="dotDesk"></i>
    </button>
    <button class="tab" data-tab="cult">
      <span class="tab-ico">悟</span><span class="tab-txt">修行</span>
    </button>
    <button class="tab" data-tab="yamen">
      <span class="tab-ico">衙</span><span class="tab-txt">神衙</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="tab-ico">市</span><span class="tab-txt">商铺</span>
    </button>
    <button class="tab" data-tab="equip">
      <span class="tab-ico">宝</span><span class="tab-txt">装备</span>
    </button>
    <button class="tab" data-tab="me">
      <span class="tab-ico">吾</span><span class="tab-txt">我的</span>
    </button>
  </nav>

  <!-- 弹窗层 -->
  <div id="modalLayer"></div>
  <!-- 暗角（最高层之下，不挡点击） -->
  <div id="vignette"></div>
  <!-- 新手引导层 -->
  <div id="guideLayer" class="hidden"></div>
  <!-- 轻提示 -->
  <div id="toastLayer"></div>

  <!-- 开场 -->
  <div id="intro" class="overlay">
    <div class="paper intro-card">
      <h1 class="title-brush">天道打工人</h1>
      <p class="intro-sub">—— 一个外包阴神的升职(？)之路 ——</p>
      <div class="intro-text">
        <p>天庭机构臃肿，预算紧缩。正式神仙只管显灵，不管干活。</p>
        <p>你在地府考公落榜，签了一份「阴阳两界劳务契」，被发配到两界交界处的破神衙，做了<b>无编制的九品阴神</b>。</p>
        <p>斗战胜佛的私活、城隍爷的阴牒、阎魔王的强制派单……神仙们付不起工钱，只能切一块<b>神格</b>与你。</p>
        <p>神格入体，或觉醒大神通，或道争相冲。三十日一考，KPI 不合格，便要贬作孤魂野鬼。</p>
      </div>
      <button class="btn btn-primary btn-lg" data-action="newGame">签字画押，入职神衙</button>
    </div>
  </div>

</div>

<!-- PixiJS 渲染引擎：defer 不挡解析；加载失败时 fx.js 自动降级为 CSS 粒子 -->
<script defer src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/lore.js"></script>
<script defer src="js/asset.js"></script>
<script defer src="js/fx.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/battle.js"></script>
<script defer src="js/minigames.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/guide.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
