<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>天道打工人</title>
<link rel="icon" type="image/jpeg" href="img/p_r0.jpg">
<!-- PWA：可安装到桌面、全屏、离线 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12100c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="天道打工人">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- 书法字体非阻塞：不挡首屏，未到用楷体兜底 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ================= 启动加载屏：必修资源齐了才放行 ================= -->
<div id="bootLoader">
  <div class="bl-ink"></div>
  <div class="bl-seal">天曹<br>候补</div>
  <h1 class="bl-title">天 道 打 工 人</h1>
  <div class="bl-sub">阴阳两界劳务契 · 无编制</div>
  <div class="bl-bar"><i id="blBar"></i></div>
  <div class="bl-meta"><span id="blTip">判官笔已蘸墨，正在勾销两界往来文书…</span><b id="blPct">0%</b></div>
</div>
<!-- 进门后切换场景的小型点卯遮罩（JS 动态填充） -->
<div id="bootGate" class="hidden"><div class="bg-card"><div class="bg-seal">点卯</div><div id="bgTip">研墨铺纸…</div></div></div>

<!-- 画质渲染分层：氛围底图 → 情景图 → Pixi 墨雾 → 浮墨/雾气兜底 -->
<div id="ambientBg"></div>
<div id="sceneBg"></div>
<div id="fxCanvas"></div>
<div id="inkLayer"></div>
<div id="mistLayer"></div>
<div id="app">

  <!-- 顶栏 -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-seal"><img id="brandSealImg" src="img/p_r0.jpg" alt="玩家立绘"></span>
      <div>
        <h1>天道打工人</h1>
        <small id="brandPname">阴阳两界劳务契 · 无编制</small>
      </div>
    </div>
    <div class="top-stats" id="topStats"></div>
  </header>

  <!-- 主舞台：各分页与下凡/战斗流程都渲染到这里 -->
  <main id="pageStage" class="stage"></main>

  <!-- 底部标签导航 -->
  <nav id="tabbar">
    <button class="tab" data-tab="desk">
      <span class="tab-ico">牍</span><span class="tab-txt">案牍</span><i class="tab-dot" id="dotDesk"></i>
    </button>
    <button class="tab" data-tab="cult">
      <span class="tab-ico">悟</span><span class="tab-txt">修行</span>
    </button>
    <button class="tab" data-tab="yamen">
      <span class="tab-ico">衙</span><span class="tab-txt">神衙</span>
    </button>
    <button class="tab" data-tab="shop">
      <span class="tab-ico">市</span><span class="tab-txt">商铺</span>
    </button>
    <button class="tab" data-tab="equip">
      <span class="tab-ico">宝</span><span class="tab-txt">装备</span>
    </button>
    <button class="tab" data-tab="me">
      <span class="tab-ico">吾</span><span class="tab-txt">我的</span>
    </button>
  </nav>

  <!-- 弹窗层 -->
  <div id="modalLayer"></div>
  <!-- 暗角（最高层之下，不挡点击） -->
  <div id="vignette"></div>
  <!-- 新手引导层 -->
  <div id="guideLayer" class="hidden"></div>
  <!-- 轻提示 -->
  <div id="toastLayer"></div>

  <!-- PWA 安装引导（JS 判断是否显示） -->
  <div id="pwaBar" class="pwa-bar" hidden>
    <span class="pwa-ico">天</span>
    <div class="pwa-txt">
      <b>装到桌面</b>
      <span id="pwaHow">全屏游玩 · 断网也能玩</span>
    </div>
    <button class="btn btn-primary btn-sm" id="pwaInstall" type="button">安装</button>
    <button class="pwa-x" id="pwaClose" type="button" aria-label="以后再说">×</button>
  </div>

  <!-- 开场 · 名号登录（两屏：纯封面 → 点击 → 登录卡） -->
  <div id="intro" class="overlay login-overlay is-cover">
    <div class="login-bg"></div>
    <div class="login-fx" aria-hidden="true">
      <div class="fx-moon"></div>
      <div class="fx-mist fx-mist-a"></div>
      <div class="fx-mist fx-mist-b"></div>
      <div class="fx-dust" id="loginDust"></div>
    </div>
    <div class="login-veil"></div>

    <!-- 第一屏：纯封面 + 底部小字入口 -->
    <div id="loginCover" class="login-cover">
      <button class="cover-enter" id="coverEnter" type="button">
        <span class="ce-line"></span>
        <span class="ce-txt">轻 触 点 卯 · 登 录</span>
        <span class="ce-line"></span>
      </button>
    </div>

    <!-- 第二屏：名号登录卡 -->
    <div class="login-wrap" id="loginWrap" hidden>
      <button class="login-back" id="loginBack" type="button" aria-label="返回封面">‹</button>
      <div class="login-head">
        <div class="login-seal">天曹<br>候补</div>
        <h1 class="title-brush login-title">天道打工人</h1>
        <p class="login-sub">阴阳两界劳务契 · 无编制</p>
      </div>
      <div id="loginCard" class="login-card"></div>
    </div>
  </div>

</div>

<!-- PixiJS 渲染引擎：defer 不挡解析；加载失败时 fx.js 自动降级为 CSS 粒子 -->
<script defer src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script defer src="js/data.js"></script>
<script defer src="js/lore.js"></script>
<script defer src="js/asset.js"></script>
<script defer src="js/fx.js"></script>
<script defer src="js/state.js"></script>
<script defer src="js/battle.js"></script>
<script defer src="js/minigames.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/guide.js"></script>
<script defer src="js/main.js"></script>
</body>
</html>
